version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: gestorflow-loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    container_name: gestorflow-promtail-server
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro 
      - ./promtail-server.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.2
    container_name: gestorflow-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=pedro_admin
      - GF_SECURITY_ADMIN_PASSWORD=$apr1$u0VoVaUz$NzsAPnwy7gjUMUagBtcMi1
      # 🚀 Configurações essenciais para o Grafana funcionar atrás do /grafana/
      - GF_SERVER_DOMAIN=gestorflow.178.104.156.13.nip.io
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:

# 🚀 A PONTE DE REDE: Dizemos a esta stack para partilhar a rede com o teu ERP
networks:
  default:
    name: gestorflowfinal_default
    external: true