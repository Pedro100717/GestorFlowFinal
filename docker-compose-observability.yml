version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: gestorflow-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100" # 🚀 Fechado ao mundo! O Nginx é que vai gerir a entrada.
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    container_name: gestorflow-promtail-server
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # 🚀 Lê os logs do GestorFlow localmente
      - ./promtail-server.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.2
    container_name: gestorflow-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=pedro_admin
      - GF_SECURITY_ADMIN_PASSWORD=TuaPasswordForteAqui
    ports:
      - "127.0.0.1:3000:3000" # 🚀 Também fechado ao mundo exterior.
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data: