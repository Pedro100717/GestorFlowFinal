<div id="wrapper">
    <div id="sidebar" class="text-white border-end" [class.toggled]="isMobileMenuOpen">
        
        <div class="sidebar-heading py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary d-flex align-items-center px-4">
            <i class="bi bi-flow-merge text-primary"></i>
            <span class="sidebar-text ms-3">GestorFlow</span>
        </div>

        <div class="list-group list-group-flush my-3">
            
            <a routerLink="/app/dashboard" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-speedometer2"></i> 
                <span class="sidebar-text">Dashboard</span>
            </a>

            <a routerLink="/app/analitica/dashboard" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-pie-chart"></i> 
                <span class="sidebar-text">Análise Analítica</span>
            </a>

            <a class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold mt-2 px-4" 
               style="cursor: pointer;"
               (click)="menuParamAberto = !menuParamAberto">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-diagram-3"></i>
                        <span class="sidebar-text">Parametrização</span>
                    </div>
                    <i class="bi small sidebar-text" [ngClass]="menuParamAberto ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                </div>
            </a>

            <div *ngIf="menuParamAberto" [@animarSubmenu] class="list-group-submenu" id="menuAnalitica">
                <a routerLink="/app/analitica/centros-custo" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-building"></i> <span class="sidebar-text">Centros Custo</span>
                </a>
                <a routerLink="/app/analitica/seccoes-homogeneas" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-layers"></i> <span class="sidebar-text">Secções Homo.</span>
                </a>
                <a routerLink="/app/artigos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-box-seam"></i> <span class="sidebar-text">Artigos</span>
                </a>
                <a routerLink="/app/clientes" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-people"></i> <span class="sidebar-text">Clientes</span>
                </a>
                <a routerLink="/app/fornecedores" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-truck"></i> <span class="sidebar-text">Fornecedores</span>
                </a>
            </div>

            <a routerLink="/app/tesouraria" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold mt-2 px-4">
                <i class="bi bi-bank"></i> <span class="sidebar-text">Tesouraria</span>
            </a>

            <a class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold mt-2 px-4" 
               style="cursor: pointer;"
               (click)="menuContasAberto = !menuContasAberto">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-journal-check"></i>
                        <span class="sidebar-text">Contas Correntes</span>
                    </div>
                    <i class="bi small sidebar-text" [ngClass]="menuContasAberto ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                </div>
            </a>

            <div *ngIf="menuContasAberto" [@animarSubmenu] class="list-group-submenu" id="menuContasCorrentes">
                <a routerLink="/app/contas-correntes/clientes" routerLinkActive="active-link" 
                   class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-arrow-down-left-circle text-success me-1"></i> <span class="sidebar-text">Clientes (Receber)</span>
                </a>
                <a routerLink="/app/contas-correntes/fornecedores" routerLinkActive="active-link" 
                   class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal py-2 small px-4 submenu-link">
                    <i class="bi bi-arrow-up-right-circle text-danger me-1"></i> <span class="sidebar-text">Fornecedores (Pagar)</span>
                </a>
            </div>

            <a routerLink="/app/compras" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-cart"></i> <span class="sidebar-text">Compras</span>
            </a>
            <a routerLink="/app/vendas" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-receipt"></i> <span class="sidebar-text">Vendas</span>
            </a>

            <a routerLink="/app/patrimonio" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-buildings"></i> <span class="sidebar-text">Património</span>
            </a>
            <a routerLink="/app/stock/acertos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-boxes"></i> <span class="sidebar-text">Stock</span>
            </a>
            <a routerLink="/app/orcamentos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-calculator"></i> <span class="sidebar-text">Orçamentos</span>
            </a>
            <a routerLink="/app/tarefas" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold px-4">
                <i class="bi bi-view-list"></i> <span class="sidebar-text">Tarefas</span>
            </a>

            <a (click)="logout()" style="cursor: pointer;" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-5 px-4">
                <i class="bi bi-power"></i> <span class="sidebar-text">Sair</span>
            </a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-secondary me-3 d-md-none" (click)="toggleMenu()">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <h2 class="fs-4 m-0 text-secondary d-none d-sm-block">GestorFlow</h2>
            </div>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle second-text fw-bold" href="javascript:void(0)" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-2"></i>{{ nomeUtilizador }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item text-danger fw-bold" (click)="logout()" style="cursor: pointer;"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid px-4 pt-4">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
