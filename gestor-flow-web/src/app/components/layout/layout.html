<div class="d-flex" id="wrapper">
    
    <div class="bg-dark text-white border-end" style="width: 260px; min-height: 100vh; position: fixed; top: 0; left: 0; bottom: 0; z-index: 1000;">
        
        <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-bottom border-secondary">
            <i class="bi bi-flow-merge me-2"></i>GestorFlow
        </div>

        <div class="list-group list-group-flush my-3">
            
            <a routerLink="/app/dashboard" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>

            <a class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold" 
               href="#menuAnalitica" data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="menuAnalitica">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-diagram-3 me-2"></i> Analítica</span>
                    <i class="bi bi-chevron-down small" style="font-size: 0.8rem;"></i>
                </div>
            </a>

            <div class="collapse" id="menuAnalitica">
                <a routerLink="/app/analitica/centros-custo" routerLinkActive="active-link" 
                   class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal ps-5 py-2 small">
                    <i class="bi bi-building me-2"></i> Centros Custo
                </a>
                
                <a routerLink="/app/analitica/seccoes-homogeneas" routerLinkActive="active-link" 
                   class="list-group-item list-group-item-action bg-transparent text-white-50 fw-normal ps-5 py-2 small">
                    <i class="bi bi-layers me-2"></i> Secções Homo.
                </a>
            </div>

            <a routerLink="/app/artigos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-box-seam me-2"></i> Artigos
            </a>

            <a routerLink="/app/clientes" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-people me-2"></i> Clientes
            </a>

            <a routerLink="/app/fornecedores" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-truck me-2"></i> Fornecedores
            </a>

            <a routerLink="/app/compras" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-cart me-2"></i> Compras
            </a>

            <a routerLink="/app/vendas" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-receipt me-2"></i> Vendas
            </a>

            <a routerLink="/app/tesouraria" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-bank me-2"></i> Tesouraria
            </a>

            <a routerLink="/app/patrimonio" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-buildings me-2"></i> Património
            </a>

            <a routerLink="/app/stock/acertos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-boxes me-2"></i> Stock
            </a>

            <a routerLink="/app/orcamentos" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-calculator me-2"></i> Orçamentos
            </a>

            <a routerLink="/app/tarefas" routerLinkActive="active-link" class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold">
                <i class="bi bi-kanban me-2"></i> Tarefas
            </a>

            <a (click)="logout()" style="cursor: pointer;" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-5">
                <i class="bi bi-power me-2"></i> Sair
            </a>

        </div>
    </div>

    <div id="page-content-wrapper" style="margin-left: 260px; width: 100%;">
        
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-4 px-4 shadow-sm">
            <div class="d-flex align-items-center">
                <h2 class="fs-4 m-0 text-secondary">Bem-vindo ao GestorFlow</h2>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle second-text fw-bold" href="javascript:void(0)" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-2"></i>Admin
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="javascript:void(0)">Perfil</a></li>
                            <li><a class="dropdown-item" href="javascript:void(0)">Configurações</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" (click)="logout()" style="cursor: pointer;">Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid px-4 pt-4">
            <router-outlet></router-outlet>
        </div>

    </div>
</div>
