<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-secondary mb-0">Definições</h3>
            <small class="text-muted">Gere o teu acesso e os dados fiscais para a emissão de documentos.</small>
        </div>
    </div>

    <div *ngIf="isCarregando" class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">A carregar...</span>
        </div>
        <p class="text-muted mt-3 fw-bold">A carregar definições...</p>
    </div>

    <div class="row g-4" *ngIf="!isCarregando">
        
        <div class="col-xl-4 col-lg-5">
            <div class="card shadow-sm border-0 h-100 rounded-4">
                <div class="card-header bg-white p-4 border-bottom d-flex align-items-center rounded-top-4">
                    <div class="icon-box bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px;">
                        <i class="bi bi-person fs-4"></i>
                    </div>
                    <div>
                        <h5 class="mb-0 fw-bold text-dark">A Minha Conta</h5>
                        <small class="text-muted">Credenciais de acesso</small>
                    </div>
                </div>
                
                <div class="card-body p-4">
                    <form [formGroup]="formPerfil" (ngSubmit)="guardarPerfil()">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Nome de Utilizador <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg bg-light border-0" formControlName="nome" 
                                   [ngClass]="{'is-invalid': formPerfil.get('nome')?.invalid && formPerfil.get('nome')?.touched}">
                            <div class="invalid-feedback">O nome é obrigatório.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control form-control-lg bg-light border-0" formControlName="email" 
                                   [ngClass]="{'is-invalid': formPerfil.get('email')?.invalid && formPerfil.get('email')?.touched}">
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-3 shadow-sm" [disabled]="formPerfil.invalid || isGuardandoPerfil">
                                {{ isGuardandoPerfil ? 'A Guardar...' : 'Atualizar Perfil' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-xl-8 col-lg-7">
            <div class="card shadow-sm border-0 h-100 rounded-4 border-start border-4 border-warning">
                <div class="card-header bg-white p-4 border-bottom d-flex align-items-center rounded-top-4">
                    <div class="icon-box bg-warning bg-opacity-10 text-warning rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 45px; height: 45px;">
                        <i class="bi bi-building fs-4"></i>
                    </div>
                    <div>
                        <h5 class="mb-0 fw-bold text-dark">Dados da Empresa</h5>
                        <small class="text-muted">Dados obrigatórios para emissão de documentos.</small>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form [formGroup]="formEmpresa" (ngSubmit)="guardarEmpresa()">
                        
                        <div class="row g-3 mb-4 align-items-center">
                            <div class="col-auto">
                                <div class="bg-light border rounded d-flex align-items-center justify-content-center text-muted shadow-sm" style="width: 90px; height: 90px; overflow: hidden; background-color: #fff;">
                                    <img *ngIf="logoAtual" [src]="getLogoUrl(logoAtual)" alt="Logo Empresa" style="width: 100%; height: 100%; object-fit: contain;">
                                    <i *ngIf="!logoAtual" class="bi bi-image fs-1 text-secondary"></i>
                                </div>
                            </div>
                            <div class="col">
                                <label class="form-label small fw-bold text-secondary">Logótipo da Empresa</label>
                                <input type="file" class="form-control" accept="image/png, image/jpeg" (change)="onLogoSelected($event)">
                            </div>
                        </div>
                        <hr class="my-4 text-muted">

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold text-secondary">Nome Fiscal <span class="text-danger">*</span></label>
                                <input type="text" class="form-control border-secondary" formControlName="nomeFiscal" [ngClass]="{'is-invalid': formEmpresa.get('nomeFiscal')?.invalid && formEmpresa.get('nomeFiscal')?.touched}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary">NIF <span class="text-danger">*</span></label>
                                <input type="text" class="form-control border-secondary" formControlName="nif" placeholder="9 dígitos" [ngClass]="{'is-invalid': formEmpresa.get('nif')?.invalid && formEmpresa.get('nif')?.touched}">
                                <div class="invalid-feedback">NIF inválido (9 dígitos).</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Email Geral <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" formControlName="emailGeral" [ngClass]="{'is-invalid': formEmpresa.get('emailGeral')?.invalid && formEmpresa.get('emailGeral')?.touched}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Telefone <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" formControlName="telefone" [ngClass]="{'is-invalid': formEmpresa.get('telefone')?.invalid && formEmpresa.get('telefone')?.touched}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Morada Sede <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" formControlName="moradaCompleta" [ngClass]="{'is-invalid': formEmpresa.get('moradaCompleta')?.invalid && formEmpresa.get('moradaCompleta')?.touched}">
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary">C. Postal <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" formControlName="codigoPostal" [ngClass]="{'is-invalid': formEmpresa.get('codigoPostal')?.invalid && formEmpresa.get('codigoPostal')?.touched}">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label small fw-bold text-secondary">Localidade <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" formControlName="localidade" [ngClass]="{'is-invalid': formEmpresa.get('localidade')?.invalid && formEmpresa.get('localidade')?.touched}">
                            </div>
                        </div>

                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-dark btn-lg fw-bold shadow-sm px-5" [disabled]="formEmpresa.invalid || isGuardandoEmpresa">
                                {{ isGuardandoEmpresa ? 'A Guardar...' : 'Gravar Dados Oficiais' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
