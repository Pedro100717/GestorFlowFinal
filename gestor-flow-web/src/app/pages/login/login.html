<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
      <div class="card-body">
        <h2 class="text-center text-primary mb-4 fw-bold">GestorFlow</h2>
        
        <form (ngSubmit)="fazerLogin()">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="exemplo@gestorflow.pt" required>
          </div>
  
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" [(ngModel)]="senha" name="senha" placeholder="******" required>
          </div>
  
          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
          </div>

          <div class="text-center mt-3">
            <span class="text-muted">Não tem conta? </span>
            <a routerLink="/register" class="text-primary fw-bold text-decoration-none">Registe-se agora</a>
          </div>
        </form>
      </div>
      <div class="card-footer text-center bg-white border-0 mt-2">
        <small class="text-muted">Gestão Comercial Inteligente</small>
      </div>
    </div>
  </div>
