<div class="d-flex align-items-center justify-content-center vh-100 bg-light px-3">
  
  <!-- Substituímos o width fixo por max-width para o telemóvel conseguir esmagar o cartão -->
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 420px; border-radius: 16px;">
    
    <!-- No PC temos muito padding (p-5), no mobile temos um pouco menos (p-4) -->
    <div class="card-body p-4 p-sm-5">
      
      <div class="text-center mb-4">
        <!-- 🚀 Rebranding -->
        <h2 class="text-primary fw-bold mb-1">TreasuryFollow</h2>
        <p class="text-muted small">Bem-vindo de volta! Insere os teus dados.</p>
      </div>
      
      <form (ngSubmit)="fazerLogin()">
        
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Email</label>
          <!-- 🚀 Rebranding do placeholder -->
          <input type="email" class="form-control form-control-lg bg-light border-0" [(ngModel)]="email" name="email" placeholder="exemplo@treasuryfollow.pt" required>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Senha</label>
          <input type="password" class="form-control form-control-lg bg-light border-0" [(ngModel)]="senha" name="senha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>

        <div class="text-center mt-4">
          <span class="text-muted small">Ainda não tens conta? </span>
          <a routerLink="/register" class="text-primary fw-bold text-decoration-none small">Regista-te aqui</a>
        </div>

      </form>
    </div>
    
    <div class="card-footer text-center bg-transparent border-0 pb-4 pt-0">
      <small class="text-muted opacity-75">Gestão Comercial Inteligente</small>
    </div>
    
  </div>
</div>
