<div class="container-fluid">
    
    <!-- CABEÇALHO SUPERIOR -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
        <h3 class="fw-bold text-secondary mb-0">Património</h3>
        <button class="btn btn-primary shadow-sm text-nowrap" (click)="abrirModalNovo()">
            <i class="bi bi-plus-lg me-2"></i>Novo Ativo
        </button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            
            <!-- TABELA PROTEGIDA COM SCROLL HORIZONTAL -->
            <div class="table-responsive tabela-patrimonio">
                <table class="table table-hover align-middle mb-0 text-nowrap">
                    <thead class="bg-light">
                        <tr>
                            <th class="border-0 p-0 col-ativo">
                                <div class="d-flex align-items-center ps-4 py-3 text-muted small text-uppercase">Ativo</div>
                            </th>
                            <th class="border-0 p-0 col-detalhes">
                                <div class="d-flex align-items-center px-2 py-3 text-muted small text-uppercase">Detalhes Chave</div>
                            </th>
                            <th class="border-0 p-0 col-data">
                                <div class="d-flex align-items-center px-2 py-3 text-muted small text-uppercase">Data Aquisição</div>
                            </th>
                            <th class="border-0 p-0 col-valor">
                                <div class="d-flex align-items-center justify-content-end px-2 py-3 text-muted small text-uppercase">Valor</div>
                            </th>
                            <th class="border-0 p-0 col-acoes">
                                <div class="d-flex align-items-center justify-content-center pe-4 py-3 text-muted small text-uppercase">Ações</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let p of listaPatrimonio">
                            <td class="ps-4 text-start col-ativo">
                                <div class="d-flex align-items-center">
                                    <div class="icon-box bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" 
                                         style="width: 40px; height: 40px;">
                                        <i class="bi" [ngClass]="getIcone(p)"></i>
                                    </div>
                                    <span class="fw-bold text-dark">{{ p.nome }}</span>
                                </div>
                            </td>
                            
                            <td class="text-muted small text-start px-2 col-detalhes">
                                <span *ngIf="p.matricula"><i class="bi bi-card-text me-1"></i> {{ p.matricula }}</span>
                                <span *ngIf="p.morada"><i class="bi bi-geo-alt me-1"></i> {{ p.morada }}</span>
                                <span *ngIf="p.numeroSerie"><i class="bi bi-barcode me-1"></i> {{ p.numeroSerie }}</span>
                            </td>

                            <td class="text-muted text-start px-2 col-data">{{ p.dataAquisicao | date:'dd/MM/yyyy' }}</td>
                            
                            <td class="fw-bold text-dark text-end px-2 font-monospace col-valor">{{ p.valorAquisicao | currency:'EUR' }}</td>
                            
                            <td class="text-center pe-4 col-acoes">
                                <button class="btn btn-sm btn-light text-danger border shadow-sm" (click)="eliminar(p.id!)" title="Eliminar Ativo">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="listaPatrimonio.length === 0">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-box-seam fs-1 d-block mb-2 opacity-50"></i>
                                <span class="fw-bold">Ainda não tem património registado.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ==========================================
     MODAL DE CRIAÇÃO
     ========================================== -->
<div class="modal fade" id="modalPatrimonio" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Novo Ativo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body p-3 p-md-4">
                
                <!-- SEPARADORES ADAPTÁVEIS NO MOBILE -->
                <ul class="nav nav-pills flex-column flex-sm-row mb-4 bg-light p-1 rounded gap-1">
                    <li class="nav-item flex-sm-fill text-center">
                        <button class="nav-link w-100 fw-bold" [class.active]="tipoSelecionado === 'VIATURA'" 
                                (click)="mudarTipo('VIATURA')">🚗 Viatura</button>
                    </li>
                    <li class="nav-item flex-sm-fill text-center">
                        <button class="nav-link w-100 fw-bold" [class.active]="tipoSelecionado === 'IMOVEL'" 
                                (click)="mudarTipo('IMOVEL')">🏠 Imóvel</button>
                    </li>
                    <li class="nav-item flex-sm-fill text-center">
                        <button class="nav-link w-100 fw-bold" [class.active]="tipoSelecionado === 'FERRAMENTA'" 
                                (click)="mudarTipo('FERRAMENTA')">🔨 Ferramenta</button>
                    </li>
                </ul>

                <form [formGroup]="formPatrimonio">
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Nome do Ativo <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" formControlName="nome" placeholder="Ex: Carrinha Ford / Armazém A">
                    </div>

                    <!-- REFEITO PARA COL-12 COL-MD-6 -->
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold">Data Aquisição</label>
                            <input type="date" class="form-control" formControlName="dataAquisicao">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold">Valor (€)</label>
                            <input type="number" class="form-control font-monospace fw-bold text-primary" formControlName="valorAquisicao">
                        </div>
                    </div>

                    <hr class="text-muted opacity-25 mb-4">

                    <!-- SEÇÃO VIATURA -->
                    <div *ngIf="tipoSelecionado === 'VIATURA'">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Matrícula <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-warning bg-opacity-10 fw-bold" formControlName="matricula" placeholder="XX-XX-XX">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Marca</label>
                                <input type="text" class="form-control" formControlName="marca" placeholder="Ex: Ford">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Modelo</label>
                                <input type="text" class="form-control" formControlName="modelo" placeholder="Ex: Transit">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Validade Seguro</label>
                                <input type="date" class="form-control" formControlName="validadeSeguro">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Próx. Inspeção</label>
                                <input type="date" class="form-control" formControlName="proximaInspecao">
                            </div>
                        </div>
                    </div>

                    <!-- SEÇÃO IMÓVEL -->
                    <div *ngIf="tipoSelecionado === 'IMOVEL'">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Morada Completa <span class="text-danger">*</span></label>
                            <textarea class="form-control" formControlName="morada" rows="2" placeholder="Morada do Imóvel"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Artigo Matricial</label>
                                <input type="text" class="form-control" formControlName="artigoMatricial" placeholder="Nº Matricial">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Tipo</label>
                                <select class="form-select" formControlName="tipo">
                                    <option value="Urbano">Urbano</option>
                                    <option value="Rústico">Rústico</option>
                                    <option value="Misto">Misto</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SEÇÃO FERRAMENTA -->
                    <div *ngIf="tipoSelecionado === 'FERRAMENTA'">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Número de Série</label>
                            <input type="text" class="form-control" formControlName="numeroSerie" placeholder="Nº de Série da Máquina/Ferramenta">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Estado de Conservação</label>
                            <select class="form-select" formControlName="estadoConservacao">
                                <option value="Novo">Novo</option>
                                <option value="Bom">Bom</option>
                                <option value="Razoável">Razoável</option>
                                <option value="Mau">Mau</option>
                                <option value="Avariado">Avariado</option>
                            </select>
                        </div>
                    </div>

                </form>
            </div>
            
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary fw-bold px-4" (click)="guardar()" [disabled]="formPatrimonio.invalid">
                    <i class="bi bi-save me-2"></i> Guardar Ativo
                </button>
            </div>
        </div>
    </div>
</div>
