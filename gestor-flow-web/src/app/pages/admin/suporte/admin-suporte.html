<div class="container-fluid py-4">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-secondary fw-bold m-0">
            <i class="bi bi-shield-lock-fill text-danger me-2"></i>Gestão de Suporte
        </h2>
        <button class="btn btn-outline-secondary" (click)="carregarTickets()">
            <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
        </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="aCarregar" class="text-center py-5">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">A carregar...</span>
        </div>
        <p class="text-muted mt-3 fw-bold">A procurar tickets na base de dados...</p>
    </div>

    <!-- Mensagem de Erro (403 Forbidden) -->
    <div *ngIf="erro" class="alert alert-danger shadow-sm border-0 border-start border-danger border-4 fw-bold">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ erro }}
    </div>

    <!-- Tabela de Tickets -->
    <div class="card border-0 shadow-sm rounded-4" *ngIf="!aCarregar && !erro">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th class="ps-4 py-3 rounded-top-start"># ID</th>
                            <th class="py-3">Tipo</th>
                            <th class="py-3">Reportado Por</th>
                            <th class="py-3">Página Origem</th>
                            <th class="py-3 w-25">Descrição</th>
                            <th class="pe-4 py-3 rounded-top-end text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Vazio -->
                        <tr *ngIf="tickets.length === 0">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Não há tickets de suporte pendentes. Que paz!
                            </td>
                        </tr>
                        
                        <!-- Lista -->
                        <tr *ngFor="let t of tickets">
                            <td class="ps-4 fw-bold text-secondary">{{ t.id }}</td>
                            <td>
                                <span class="badge" 
                                      [ngClass]="{'bg-danger': t.tipo === 'BUG', 'bg-warning text-dark': t.tipo === 'DUVIDA', 'bg-info text-dark': t.tipo === 'MELHORIA'}">
                                    {{ t.tipo }}
                                </span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-person-circle fs-4 text-muted me-2"></i>
                                    <div>
                                        <!-- 🚀 CORRIGIDO AQUI: A usar a propriedade plana -->
                                        <div class="fw-bold text-dark">{{ t.nomeUtilizador }}</div>
                                        <div class="small text-muted" style="font-size: 0.8rem;">{{ t.emailUtilizador }}</div>
                                    </div>
                                </div>
                            </td>
                            <td><code class="text-secondary bg-light px-2 py-1 rounded small">{{ t.paginaOrigem }}</code></td>
                            <td>
                                <div class="text-truncate text-muted" style="max-width: 300px;" [title]="t.descricao">
                                    {{ t.descricao }}
                                </div>
                            </td>
                            <td class="pe-4 text-end">
                                <!-- 🚀 EVENTO DE CLIQUE PARA VER -->
                                <button class="btn btn-sm btn-light text-primary border me-2" title="Ver detalhes completos" (click)="verDetalhes(t)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <!-- 🚀 EVENTO DE CLIQUE PARA RESOLVER (APAGAR) -->
                                <button class="btn btn-sm btn-light text-success border" title="Resolver" (click)="resolverTicket(t.id)">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
