<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light px-3 py-4">
  
  <!-- max-width protege o ecrã pequeno, width: 100% garante que estica até ao limite -->
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 450px; border-radius: 16px;">
    
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <h2 class="text-primary fw-bold mb-1">Criar Conta</h2>
        <p class="text-muted small">Junta-te ao GestorFlow e controla o teu negócio</p>
      </div>

      <!-- Alerta de Erro Geral -->
      <div class="alert alert-danger py-2 px-3 small d-flex align-items-center fw-bold rounded-3 shadow-sm" *ngIf="erroGeral">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i> {{ erroGeral }}
      </div>
      
      <form #formRegisto="ngForm" (ngSubmit)="fazerRegisto()">
        
        <div class="mb-3">
          <label class="form-label fw-bold small text-secondary">Nome Completo</label>
          <div class="input-group input-group-lg" [ngClass]="{'is-invalid': erros.nomeUtilizador}">
            <!-- Ícones integrados no fundo bg-light para um design sem quebras -->
            <span class="input-group-text bg-light border-0 text-muted pe-2"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control bg-light border-0 ps-2" 
                   [(ngModel)]="nome" name="nome" placeholder="O teu nome" required>
          </div>
          <div class="text-danger small mt-1 fw-bold" *ngIf="erros.nomeUtilizador">
            {{ erros.nomeUtilizador }}
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small text-secondary">Email</label>
          <div class="input-group input-group-lg" [ngClass]="{'is-invalid': erros.email}">
            <span class="input-group-text bg-light border-0 text-muted pe-2"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control bg-light border-0 ps-2" 
                   [(ngModel)]="email" name="email" placeholder="email@exemplo.com" required email>
          </div>
          <div class="text-danger small mt-1 fw-bold" *ngIf="erros.email">
            {{ erros.email }}
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold small text-secondary">Senha</label>
          <div class="input-group input-group-lg" [ngClass]="{'is-invalid': erros.senha || (senhaCtrl.invalid && senhaCtrl.touched)}">
            <span class="input-group-text bg-light border-0 text-muted pe-2"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control bg-light border-0 ps-2" 
                   [(ngModel)]="senha" name="senha" #senhaCtrl="ngModel"
                   pattern="^(?=.*[0-9])(?=.*[A-Z]).{8,}$" 
                   placeholder="••••••••" required>
          </div>
          <div class="text-danger small mt-1 fw-bold" *ngIf="erros.senha">
            {{ erros.senha }}
          </div>
          <!-- Mensagem de validação nativa melhorada visualmente -->
          <div class="text-danger small mt-1 fw-bold" *ngIf="senhaCtrl.errors?.['pattern'] && senhaCtrl.touched && !erros.senha">
            <i class="bi bi-shield-exclamation me-1"></i>A senha tem de ter pelo menos 8 caracteres, 1 maiúscula e 1 número.
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" [disabled]="formRegisto.invalid">
          <i class="bi bi-person-plus me-2"></i>Criar Conta Grátis
        </button>
      </form>

      <hr class="my-4 opacity-25">

      <div class="text-center">
        <span class="text-muted small">Já tens conta? </span>
        <a routerLink="/login" class="text-primary fw-bold text-decoration-none small">Entrar agora</a>
      </div>

    </div>
  </div>
</div>
