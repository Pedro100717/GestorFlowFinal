<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-secondary">Meus Fornecedores</h3>
      <button class="btn btn-primary shadow-sm" (click)="abrirModalNovo()">
        <i class="bi bi-truck me-2"></i>Novo Fornecedor
      </button>
    </div>
  
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="ps-4 py-3 border-0 text-muted small uppercase">Fornecedor</th>
                <th class="border-0 text-muted small uppercase">NIF</th>
                <th class="border-0 text-muted small uppercase">Contactos</th>
                <th class="border-0 text-muted small uppercase">Website</th>
                <th class="border-0 text-muted small uppercase text-end pe-4">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let f of listaFornecedores">
                <td class="ps-4 fw-bold text-dark">{{ f.nome }}</td>
                
                <td>
                    <span *ngIf="f.nif" class="badge bg-light text-dark border">{{ f.nif }}</span>
                    <span *ngIf="!f.nif" class="text-muted small">n/a</span>
                </td>
                
                <td>
                    <div class="small">{{ f.email || '-' }}</div>
                    <div class="small text-muted">{{ f.telefone || '-' }}</div>
                </td>
                
                <td>
                    <a *ngIf="f.website" [href]="f.website" target="_blank" class="small text-decoration-none">
                        <i class="bi bi-link-45deg"></i> Visitar
                    </a>
                    <span *ngIf="!f.website" class="text-muted small">-</span>
                </td>

                <td class="text-end pe-4">
                  <button class="btn btn-sm btn-light text-primary me-2" (click)="editarFornecedor(f)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-light text-danger" (click)="eliminarFornecedor(f.id!)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="listaFornecedores.length === 0">
                <td colspan="5" class="text-center py-5 text-muted">
                  <i class="bi bi-truck fs-1 d-block mb-2 opacity-50"></i>
                  <span class="fw-bold">Ainda não tens fornecedores.</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal fade" id="modalFornecedor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">{{ idEmEdicao ? 'Editar' : 'Novo' }} Fornecedor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form [formGroup]="formFornecedor">
            
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label small fw-bold">Nome da Empresa <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="nome" 
                           [ngClass]="{ 'is-invalid': f['nome'].touched && f['nome'].invalid }">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label small fw-bold">NIF</label>
                    <input type="text" class="form-control" formControlName="nif">
                    <div *ngIf="f['nif'].errors?.['pattern']" class="invalid-feedback">NIF Inválido.</div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold">Email</label>
                    <input type="email" class="form-control" formControlName="email">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold">Telefone</label>
                    <input type="text" class="form-control" formControlName="telefone">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Website</label>
                <input type="text" class="form-control" formControlName="website" placeholder="https://...">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Morada</label>
                <textarea class="form-control" formControlName="morada" rows="2"></textarea>
            </div>
  
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" [disabled]="formFornecedor.invalid" (click)="guardarFornecedor()">
            <i class="bi bi-save me-2"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
