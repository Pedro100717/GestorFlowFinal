<div class="container-fluid">
    
  <!-- CABEÇALHO: Empilha no telemóvel, lado a lado no PC -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
    <h3 class="fw-bold text-secondary mb-0">Meus Fornecedores</h3>
    
    <!-- BOTÃO: text-nowrap para impedir quebras de linha indesejadas no telemóvel -->
    <button class="btn btn-primary shadow-sm text-nowrap" (click)="abrirModalNovo()">
      <i class="bi bi-truck me-2"></i>Novo Fornecedor
    </button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      
      <!-- table-responsive + classe SCSS de larguras mínimas -->
      <div class="table-responsive tabela-fornecedores">
        
        <!-- text-nowrap protege os dados de serem esmagados no mobile -->
        <table class="table table-hover align-middle mb-0 text-nowrap">
          
          <thead class="bg-light">
            <tr>
              <!-- FORNECEDOR: Alinhado à esquerda com margem ps-4 -->
              <th class="border-0 p-0 col-fornecedor">
                <div class="d-flex align-items-center ps-4 py-3 text-muted small text-uppercase">
                  Fornecedor
                </div>
              </th>
              
              <!-- COLUNAS DO MEIO: Com px-2 para alinhar com o padding nativo das células -->
              <th class="border-0 p-0 col-nif">
                <div class="d-flex align-items-center px-2 py-3 text-muted small text-uppercase">
                  NIF
                </div>
              </th>
              
              <th class="border-0 p-0 col-contactos">
                <div class="d-flex align-items-center px-2 py-3 text-muted small text-uppercase">
                  Contactos
                </div>
              </th>
              
              <th class="border-0 p-0 col-website">
                <div class="d-flex align-items-center px-2 py-3 text-muted small text-uppercase">
                  Website
                </div>
              </th>
              
              <!-- AÇÕES: Centrado para perfeita simetria visual com os botões -->
              <th class="border-0 p-0 col-acoes">
                <div class="d-flex align-items-center justify-content-center py-3 text-muted small text-uppercase">
                  Ações
                </div>
              </th>
            </tr>
          </thead>
          
          <tbody>
            <tr *ngFor="let f of listaFornecedores">
              <td class="ps-4 fw-bold text-dark text-start col-fornecedor">{{ f.nome }}</td>
              
              <td class="text-start px-2 col-nif">
                  <span *ngIf="f.nif" class="badge bg-light text-dark border">{{ f.nif }}</span>
                  <span *ngIf="!f.nif" class="text-muted small">n/a</span>
              </td>
              
              <td class="text-start px-2 col-contactos">
                  <div class="small">{{ f.email || '-' }}</div>
                  <div class="small text-muted">{{ f.telefone || '-' }}</div>
              </td>
              
              <td class="text-start px-2 col-website">
                  <a *ngIf="f.website" [href]="f.website" target="_blank" class="small text-decoration-none">
                      <i class="bi bi-link-45deg"></i> Visitar
                  </a>
                  <span *ngIf="!f.website" class="text-muted small">-</span>
              </td>

              <td class="text-center col-acoes">
                <button class="btn btn-sm btn-light text-primary me-2" (click)="editarFornecedor(f)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-light text-danger" (click)="eliminarFornecedor(f.id!)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            
            <tr *ngIf="listaFornecedores.length === 0">
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-truck fs-1 d-block mb-2 opacity-50"></i>
                <span class="fw-bold">Ainda não tens fornecedores.</span>
              </td>
            </tr>
          </tbody>
          
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================
     MODAL DE CRIAÇÃO / EDIÇÃO
     ========================================== -->
<div class="modal fade" id="modalFornecedor" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold">{{ idEmEdicao ? 'Editar' : 'Novo' }} Fornecedor</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body p-4">
        <form [formGroup]="formFornecedor">
          
          <div class="row">
              <div class="col-md-8 mb-3">
                  <label class="form-label small fw-bold">Nome da Empresa <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" formControlName="nome" 
                         [ngClass]="{ 'is-invalid': f['nome'].touched && f['nome'].invalid }">
              </div>
              <div class="col-md-4 mb-3">
                  <label class="form-label small fw-bold">NIF</label>
                  <input type="text" class="form-control" formControlName="nif">
                  <div *ngIf="f['nif'].errors?.['pattern']" class="invalid-feedback">NIF Inválido.</div>
              </div>
          </div>

          <div class="row">
              <div class="col-md-6 mb-3">
                  <label class="form-label small fw-bold">Email</label>
                  <input type="email" class="form-control" formControlName="email">
              </div>
              <div class="col-md-6 mb-3">
                  <label class="form-label small fw-bold">Telefone</label>
                  <input type="text" class="form-control" formControlName="telefone">
              </div>
          </div>

          <div class="mb-3">
              <label class="form-label small fw-bold">Website</label>
              <input type="text" class="form-control" formControlName="website" placeholder="https://...">
          </div>

          <div class="mb-3">
              <label class="form-label small fw-bold">Morada</label>
              <textarea class="form-control" formControlName="morada" rows="2"></textarea>
          </div>

        </form>
      </div>
      
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" [disabled]="formFornecedor.invalid" (click)="guardarFornecedor()">
          <i class="bi bi-save me-2"></i>Guardar
        </button>
      </div>
      
    </div>
  </div>
</div>
