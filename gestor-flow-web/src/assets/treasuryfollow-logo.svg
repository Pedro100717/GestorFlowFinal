<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="finBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <!-- Transição de Azul Forte para Azul Vivo -->
      <stop offset="0%" stop-color="#1d4ed8"/> 
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- T com corte diagonal na ponta direita -->
  <path d="M80 100 L320 100 L270 160 L230 160 L230 320 L170 320 L170 160 L80 160 Z" fill="url(#finBlue)"/>
  
  <!-- Detalhe geométrico para dar profundidade alinhado com o tom azul -->
  <path d="M230 160 L270 160 L320 100 L230 100 Z" fill="#1e3a8a" opacity="0.4"/>
</svg>
