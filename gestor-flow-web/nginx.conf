# 1. Redirecionar os desatentos (HTTP para HTTPS)
server {
    listen 80;
    server_name gestorflow.178.104.156.13.nip.io;
    return 301 https://$host$request_uri;
}

# 2. O Cofre Forte (HTTPS)
server {
    listen 443 ssl;
    server_name gestorflow.178.104.156.13.nip.io;

    ssl_certificate /etc/letsencrypt/live/gestorflow.178.104.156.13.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestorflow.178.104.156.13.nip.io/privkey.pem;

    # Abaixo disto, manténs o teu código antigo de encaminhamento!
    # Exemplo:
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # O Nginx fala com o backend internamente!
        proxy_pass http://backend:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}